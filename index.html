/* Compact top layout after removing descriptive text */
header{padding-top:16px;padding-bottom:14px}header h1{margin-bottom:0}.wrap{padding-top:12px}.calendar{margin-top:10px;margin-bottom:10px}.calhead{margin-bottom:8px}.daynav{margin-top:10px;margin-bottom:8px}.status{margin-bottom:10px}

/* Calendar weekday/holiday colors. Preserve scheduled day emphasis. */
.calweekday:first-child{color:#c62828;font-weight:700}
.calweekday:nth-child(7){color:#1565c0;font-weight:700}
.caldate.is-sunday,.caldate.is-holiday{color:#c62828}
.caldate.is-saturday:not(.is-holiday){color:#1565c0}
.caldate.selected:not(.is-sunday):not(.is-saturday):not(.is-holiday){color:#fff}
.caldate.selected.is-sunday,.caldate.selected.is-holiday{background:#fff1f1;color:#b71c1c;border:2px solid #146b5d}

.time-start,.time-arrival{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Header backup dropdown */

.caldate.selected.is-sunday,
.caldate.selected.is-holiday,
.caldate.selected.is-saturday:not(.is-holiday),
.caldate.selected:not(.is-sunday):not(.is-saturday):not(.is-holiday){

.caldate.selected.is-saturday:not(.is-holiday){color:#1565c0}

.time-start{font-size:18px;font-weight:800;color:#173b37;letter-spacing:-.3px}
.time-arrow{font-size:12px;font-weight:400;color:#94a69f;line-height:1;margin:1px 0}

/* 時刻を予定カード全体の高さに合わせて上下中央へ */

/* iPhone: modal stays within the visible screen; only fields scroll. */
.modalback{padding:env(safe-area-inset-top, 0px) 8px env(safe-area-inset-bottom, 0px);overscroll-behavior:contain}
.modal{display:flex;flex-direction:column;width:min(650px,100%);height:min(740px,calc(100dvh - 18px));max-height:calc(100dvh - 18px);overflow:hidden;padding:16px 15px 12px;border-radius:16px}

/* iPhone: registration fields scroll vertically only, never horizontally. */
.modalback,.modal,.modal #form,.modal .fields{min-width:0;max-width:100%;box-sizing:border-box;overflow-x:hidden}
.modal .fields{display:flex;flex-direction:column;gap:10px;width:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.modal .field,.modal input,.modal select,.modal textarea{min-width:0;max-width:100%;box-sizing:border-box}
.modal .field{width:100%;flex:0 0 auto;overflow:hidden}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;display:block;font-size:16px}
.modal .modalfooter{min-width:0;max-width:100%;overflow-x:hidden}

.expo-reservation-time{font-size:13px;color:#476258;font-weight:650;margin-top:3px;line-height:1.4}

/* iPhone: keep form input borders clear of the vertical scroll indicator. */
.modal .fields{
  box-sizing:border-box;
  padding-right:18px;
  padding-left:2px;
  scrollbar-gutter:stable;
}
@media(max-width:640px){
  .modal .fields{padding-right:18px;padding-left:2px}
}

/* iPhone Safari: native date/time widgets need their own intrinsic layout.
   Do not clip their WebKit internals; keep the field itself inside the modal. */
.modal .fields > .field{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.modal .field > input,
.modal .field > select,
.modal .field > textarea{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;margin:0}
.modal .field > input[type="date"],
.modal .field > input[type="time"]{
  -webkit-appearance:none;
  appearance:none;
  position:relative;
  display:block;
  inline-size:100%;
  min-inline-size:0;
  max-inline-size:100%;
  height:44px;
  min-height:44px;
  padding:8px 10px;
  overflow:visible;
  text-align:left;
  font-size:16px;
  background:#fff;
  border:1px solid #ccdad2;
  border-radius:9px;
}
.modal .field > input[type="date"]::-webkit-date-and-time-value,
.modal .field > input[type="time"]::-webkit-date-and-time-value{min-width:0;text-align:left;width:100%;}
.modal .field > input[type="date"]::-webkit-datetime-edit,
.modal .field > input[type="time"]::-webkit-datetime-edit{min-width:0;text-align:left;padding:0}
.modal .field > input[type="date"]::-webkit-calendar-picker-indicator,
.modal .field > input[type="time"]::-webkit-calendar-picker-indicator{margin:0;}
.modal .field > select{height:44px;min-height:44px}

/* Booking confirmation alongside the time: ○ confirmed / blank pending / − not applicable. */

#schedulePage .caldate.expo-day.is-saturday:not(.is-holiday){color:#1565c0}

<section id="loginView" class="loginbox"><h2>家族専用ログイン</h2><p class="sub">Firebaseに登録したメールアドレスとパスワードでログインしてください。アカウントの新規作成はアプリからできません。</p><form id="loginForm"><label class="field">メールアドレス<input id="loginEmail" type="email" autocomplete="username" required></label><label class="field">パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="submit" id="loginBtn">ログイン</button></form><p class="sub" id="loginError" role="alert"></p></section>
<div id="workspace">
<main class="wrap">
<nav class="main-tabs" aria-label="画面切り替え"><button id="tabSchedule" class="active" type="button" onclick="switchPage('schedule')">スケジュール</button><button id="tabBookings" type="button" onclick="switchPage('bookings')">予約管理</button></nav>

<section class="calendar" aria-label="月間予定カレンダー"><div class="calhead"><button type="button" class="btn alt" onclick="moveMonth(-1)" aria-label="前の月">‹ 前月</button><strong id="calendarMonth"></strong><button type="button" class="btn alt" onclick="moveMonth(1)" aria-label="次の月">次月 ›</button></div><div id="calendarGrid" class="calgrid"></div><div class="calendar-legend"><span><i class="legend-expo"></i>花博に行く日</span><span><i class="legend-other"></i>その他の予定</span></div></section><div id="daySummary" class="day-summary" aria-live="polite"></div>

<script>
const KEY='greenexpo-trip-v1';const types={train:['🚃','電車','transport'],shinkansen:['🚄','新幹線','transport'],bus:['🚌','シャトルバス','transport'],flight:['✈️','飛行機','transport'],expo:['🎟️','花博','expo'],pavilion:['🏵️','パビリオン','expo'],hotel:['🏨','宿泊','hotel'],other:['📍','その他','other']};let entries=[];let selectedDay='';let calendarMonth='';let initialScheduleLoaded=false;let currentPage='schedule';let bookingCategory='hotel';
let db, auth, unsub=null, loggedIn=false, isMember=false;
const el=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(msg,error=false){const n=el('syncStatus');n.textContent=msg;n.classList.toggle('error',error);n.style.display=(!error && msg.startsWith('同期済み'))?'none':'block'}
async function saveEntry(e){if(!loggedIn||!isMember)throw Error('家族メンバー登録を確認してください');await db.collection('reservations').doc(e.id).set(e)}
function chooseDay(day){if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return;selectedDay=day;calendarMonth=day.slice(0,7);render()}
function moveMonth(amount){const [year,month]=(calendarMonth||selectedDay.slice(0,7)).split('-').map(Number);const d=new Date(year,month-1+amount,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderCalendar()}
function scheduledDays(){const found=new Set();for(const e of entries){if(!/^\d{4}-\d{2}-\d{2}$/.test(e.startDate||''))continue;let d=new Date(e.startDate+'T12:00:00');const limit=/^\d{4}-\d{2}-\d{2}$/.test(e.endDate||'')?new Date(e.endDate+'T12:00:00'):d;for(let i=0;i<366&&d<=limit;i++,d.setDate(d.getDate()+1)){found.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}}return [...found].sort()}

// 2027 Japanese national holidays and statutory holidays (Cabinet Office, including March 22 substitute holiday).
// 2026 included for navigation to the previous year. Other years are not asserted as verified holidays.
const japaneseHolidays = new Set([
'2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
'2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23'
]);
function renderCalendar(){if(!calendarMonth)calendarMonth=selectedDay.slice(0,7);const [year,month]=calendarMonth.split('-').map(Number);el('calendarMonth').textContent=year+'年'+month+'月';const first=new Date(year,month-1,1);const count=new Date(year,month,0).getDate();const scheduled=new Set(scheduledDays());const expoDates=new Set(entries.filter(e=>e.type==='expo'&&/^\d{4}-\d{2}-\d{2}$/.test(e.startDate||'')).map(e=>e.startDate));let html=['日','月','火','水','木','金','土'].map(w=>'<span class="calweekday">'+w+'</span>').join('');for(let x=0;x<first.getDay();x++)html+='<span></span>';for(let d=1;d<=count;d++){const day=calendarMonth+'-'+String(d).padStart(2,'0');const has=scheduled.has(day);const isExpoDay=expoDates.has(day);const weekday=new Date(year,month-1,d).getDay();const isHoliday=japaneseHolidays.has(day);const colorClass=isHoliday?' is-holiday':weekday===0?' is-sunday':weekday===6?' is-saturday':'';html+='<button type="button" class="caldate'+(has?' has-event':'')+(isExpoDay?' expo-day':'')+colorClass+(day===selectedDay?' selected':'')+'" '+(day===selectedDay?'aria-current="date" ':'')+'aria-label="'+month+'月'+d+'日'+(isHoliday?'、祝日・休日':'')+(isExpoDay?'、花博に行く日':has?'、その他の予定あり':'')+'" onclick="chooseDay(\''+day+'\')">'+d+'</button>'}el('calendarGrid').innerHTML=html;}
function relevantDay(e,day){return e.startDate<=day && (!e.endDate || e.endDate>=day)}
function render(){
 if(!selectedDay){selectedDay=scheduledDays()[0]||'2027-03-19'}
 renderCalendar();
 const list=entries.filter(e=>relevantDay(e,selectedDay)).sort((a,b)=>(a.startDate+'T'+(a.startTime||'00:00')).localeCompare(b.startDate+'T'+(b.startTime||'00:00')));
 const root=el('events');
 el('daySummary').textContent=new Date(selectedDay+'T12:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 if(currentPage==='bookings')renderBookingManagement();
 if(!list.length){root.innerHTML='<div class="empty">この日の予定はありません。「＋ 予定を登録」から追加できます。</div>';return}
 root.innerHTML=list.map(e=>{
   const t=types[e.type]||types.other;
   const start=escapeHtml(e.startTime||'終日');
   const arrival=escapeHtml(e.endTime||'');
   const timeDisplay=e.endTime&&e.type!=='hotel'?`<span class="time-start">${start}</span><span class="time-arrow">↓</span><span class="time-arrival">${arrival}</span>`:`<span class="time-start">${start}</span>`;
   const bookingEligible=['shinkansen','flight','hotel','bus','expo'].includes(e.type);
   const bookingMark=bookingEligible?(e.bookingConfirmed==='yes'?'○':''):'－';
   const bookingTitle=bookingEligible?(bookingMark?'予約確認済み':'予約未確認'):'予約確認対象外';
   const bookingDisplay=`<span class="booking-mark${bookingMark==='○'?' confirmed':''}" title="${bookingTitle}" aria-label="${bookingTitle}">${bookingMark||'&nbsp;'}</span>`;
   const place=(e.type==='expo'?[e.from]:[e.from,e.to]).filter(Boolean).map(escapeHtml).join(' → ');
   const reservationTime=e.type==='expo'?normalizeReservationTime(e.reservationTime||e.to):'';
   const reservationLine=reservationTime?`<div class="expo-reservation-time">予約時刻：${escapeHtml(formatReservationTime(reservationTime))}</div>`:'';
   const extra=[e.seat&&(e.type==='hotel'?'部屋：':'座席・部屋など：')+e.seat,e.memo].filter(Boolean).map(escapeHtml).join('\n');
   const dateSuffix=e.type!=='hotel'&&e.endDate&&e.endDate!==e.startDate?`<span class="event-end-date">終了日：${escapeHtml(e.endDate)}</span>`:'';
   return `<div class="event"><div class="time"><span class="time-values">${timeDisplay}</span>${bookingDisplay}</div><div class="eventbody${e.type==='expo'?' expo-highlight':''}"><div class="eventhead"><div class="event-ident"><span class="type">${t[0]} ${t[1]}</span>${e.service?`<span class="service-inline">${escapeHtml(e.service)}</span>`:''}</div><div class="actions"><button onclick="openForm('${escapeHtml(e.id)}')">編集</button></div></div>${place?`<div class="place-title">${place}</div>`:''}${reservationLine}${extra?`<div class="details">${extra}</div>`:''}${dateSuffix}</div></div>`
 }).join('');
}
function switchPage(page){
 currentPage=page;
 el('schedulePage').hidden=page!=='schedule';el('bookingsPage').hidden=page!=='bookings';
 el('tabSchedule').classList.toggle('active',page==='schedule');el('tabBookings').classList.toggle('active',page==='bookings');
 if(page==='bookings')renderBookingManagement();
}
function switchBookingCategory(category){bookingCategory=category;renderBookingManagement()}
function bookingDate(date){if(!date)return '日付未登録';const d=new Date(date+'T12:00:00');return Number.isNaN(d.getTime())?escapeHtml(date):escapeHtml(d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}))}
function bookingValue(value,fallback='未入力'){return escapeHtml(value||fallback)}
function bookingStatus(e){return e.bookingConfirmed==='yes'?'<span class="confirmed-label">○ 予約済</span>':'<span class="unconfirmed-label">未確認</span>'}
function renderBookingManagement(){
 const names={hotel:'bookHotel',bus:'bookBus',travel:'bookTravel'};
 Object.keys(names).forEach(k=>el(names[k]).classList.toggle('active',k===bookingCategory));
 const relevant=entries.filter(e=>bookingCategory==='hotel'?e.type==='hotel':bookingCategory==='bus'?e.type==='bus':['flight','shinkansen'].includes(e.type)).sort((a,b)=>(a.startDate+'T'+(a.startTime||'00:00')).localeCompare(b.startDate+'T'+(b.startTime||'00:00')));
 if(!relevant.length){el('bookingList').innerHTML='<div class="booking-empty">この種類の予約はまだ登録されていません。</div>';return}
 // 行き・帰りを指定していない過去の予約は、時刻順で交互に仮分類します。
 const autoDir=new Map();let i=0;for(const e of relevant){autoDir.set(e.id,e.direction||((i++%2===0)?'out':'back'))}
 const groups=new Map();for(const e of relevant){const k=e.startDate||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}
 const cards=[...groups].map(([date,items])=>{
  let content='';
  if(bookingCategory==='hotel'){
   content=items.map(e=>`<article class="booking-entry"><div class="booking-row"><span class="booking-kind">🏨 宿泊</span>${bookingStatus(e)}<button class="booking-edit" type="button" onclick="openForm('${escapeHtml(e.id)}')">編集</button></div><div class="booking-primary">${bookingValue(e.from,'施設名未入力')}</div><div class="booking-detail">日付：${bookingDate(e.startDate)}</div><div class="booking-detail">部屋：${bookingValue(e.seat,'—')}</div>${e.memo?`<div class="booking-detail booking-memo">メモ：${escapeHtml(e.memo)}</div>`:''}</article>`).join('');
  }else{
   content=['out','back'].map(dir=>{
    const subset=items.filter(e=>autoDir.get(e.id)===dir);
    const title=dir==='out'?'行き':'帰り';
    const entriesHTML=subset.length?subset.map(e=>{
      if(bookingCategory==='bus')return `<article class="booking-entry"><div class="booking-row"><span class="booking-kind">🚌 シャトルバス</span>${bookingStatus(e)}<button class="booking-edit" type="button" onclick="openForm('${escapeHtml(e.id)}')">編集</button></div><div class="booking-primary">${bookingValue(e.startTime,'時刻未入力')}${e.endTime?' → '+escapeHtml(e.endTime):''}</div><div class="booking-detail">${dir==='out'?'出発駅':'到着駅'}：${bookingValue(dir==='out'?e.from:e.to)}</div>${e.memo?`<div class="booking-detail booking-memo">${escapeHtml(e.memo)}</div>`:''}</article>`;
      const kind=e.type==='flight'?'✈️ 飛行機':'🚄 新幹線';return `<article class="booking-entry"><div class="booking-row"><span class="booking-kind">${kind}</span>${bookingStatus(e)}<button class="booking-edit" type="button" onclick="openForm('${escapeHtml(e.id)}')">編集</button></div><div class="booking-primary">${bookingValue(e.from)} → ${bookingValue(e.to)}</div><div class="booking-detail">時刻：${bookingValue(e.startTime,'—')}${e.endTime?' → '+escapeHtml(e.endTime):''}</div><div class="booking-detail">${e.type==='flight'?'便名':'路線・列車名'}：${bookingValue(e.service,'—')}</div>${e.seat?`<div class="booking-detail">座席：${escapeHtml(e.seat)}</div>`:''}</article>`;
    }).join(''):'<div class="booking-slot-empty">登録なし</div>';
    return `<div class="booking-direction"><h4>${title}</h4>${entriesHTML}</div>`
   }).join('');
  }
  return `<section class="booking-day"><h3>${bookingDate(date)}</h3>${content}</section>`;
 });
 el('bookingList').innerHTML=cards.join('');
}
function normalizeReservationTime(value){
 const raw=String(value||'').trim();
 const match=raw.match(/^(\d{1,2}):?(\d{2})$/);
 if(!match)return '';
 const hour=Number(match[1]),minute=Number(match[2]);
 return hour<24&&minute<60?String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0'):'';
}
function formatReservationTime(value){return String(value).replace(/^0(\d:)/,'$1')}
function typeChange(){
 const t=el('type').value;
 const labels={
  train:['乗車駅','降車駅'],shinkansen:['乗車駅','降車駅'],
  bus:['乗車場所','降車場所'],flight:['出発空港','到着空港'],
  expo:['場所','受付・集合場所'],pavilion:['パビリオン名・場所','受付・集合場所'],hotel:['宿泊施設名',''],
  other:['場所・出発地','到着地・詳細']
 };
 const names=labels[t]||labels.other;
 el('fromLabel').firstChild.textContent=names[0];
 el('toLabel').firstChild.textContent=names[1];
 // 非表示の入力値は編集時に消さず、既存の予約情報を保持します。
 el('endDateLabel').hidden=['train','shinkansen','bus','flight','expo','pavilion','hotel'].includes(t);
 el('endTimeLabel').hidden=t==='hotel';
 el('fromLabel').hidden=t==='expo';
 el('toLabel').hidden=['hotel','pavilion','expo'].includes(t);
 el('reservationTimeLabel').hidden=t!=='expo';
 el('bookingConfirmedLabel').hidden=!['shinkansen','flight','hotel','bus','expo'].includes(t);
 el('directionLabel').hidden=!['shinkansen','flight','bus'].includes(t);
 el('serviceLabel').hidden=['bus','expo','pavilion','hotel'].includes(t);
 el('seatLabel').hidden=['train','bus','flight','expo','pavilion'].includes(t);
 el('serviceLabel').firstChild.textContent=t==='train'?'路線名':t==='flight'?'便名':t==='shinkansen'?'列車名・予約区分':'便名・列車名・予約区分';
 el('seatLabel').firstChild.textContent=t==='hotel'?'部屋':t==='shinkansen'?'座席':'座席・部屋・人数';
}
function openForm(id=''){el('form').reset();el('id').value='';el('startDate').value=selectedDay||'2027-03-19';el('endDate').value=el('startDate').value;const e=entries.find(x=>x.id===id);if(e){Object.keys(e).forEach(k=>{if(el(k))el(k).value=e[k]||''});if(e.type==='expo'&&!e.reservationTime){el('reservationTime').value=normalizeReservationTime(e.to)||''}}el('formTitle').textContent=e?'予定を編集':'予定を登録';el('editDeleteBtn').style.display=e?'inline-block':'none';if(!el('endDate').value)el('endDate').value=el('startDate').value;typeChange();el('overlay').classList.add('show')}
el('startDate').addEventListener('change',()=>{el('endDate').value=el('startDate').value});
function closeForm(){el('overlay').classList.remove('show')}
el('form').addEventListener('submit',ev=>{ev.preventDefault();const keys=['id','type','startDate','startTime','endDate','endTime','from','to','service','seat','memo','reservationTime','bookingConfirmed','direction'];const e=Object.fromEntries(keys.map(k=>[k,el(k).value.trim()]));e.title=types[e.type]?.[1]||'その他';if(e.endDate&&e.endDate<e.startDate){alert('終了日は開始日以降にしてください');return}if(e.endDate===e.startDate&&e.startTime&&e.endTime&&e.endTime<e.startTime){alert('終了時刻を確認してください');return}if(!e.id)e.id=(window.crypto?.randomUUID?.()||Date.now()+'-'+Math.random());saveEntry(e).then(()=>{closeForm();chooseDay(e.startDate);setStatus('保存しました。家族の端末にも同期されます。')}).catch(err=>{console.error(err);alert('保存できませんでした。家族メンバー登録と通信状態を確認してください。')})});
async function deleteFromEditor(){const id=el('id').value;if(!id)return;const ok=await removeEntry(id);if(ok)closeForm()}
async function removeEntry(id){if(!isMember){alert('家族メンバー登録が必要です');return false;}if(!confirm('この予定を削除しますか？'))return false;try{await db.collection('reservations').doc(id).delete();setStatus('削除しました。');return true;}catch(err){console.error(err);alert('削除できませんでした。');return false;}}
