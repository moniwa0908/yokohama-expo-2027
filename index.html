<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#173b37;background:#f6f9f6}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{background:#f6f9f6}header{background:#146b5d;color:white;padding:25px max(18px,calc((100vw - 980px)/2))}header h1{font-size:25px;margin:0 0 5px;line-height:1.25}header p{margin:0;color:#dcf4ea;font-size:13px;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:20px 16px 70px;overflow-x:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.sub{color:#6b7e78;font-size:13px}.btn,button{border:0;border-radius:11px;background:#146b5d;color:white;padding:10px 15px;font-size:14px;font-weight:650;cursor:pointer}.btn.alt{background:white;color:#146b5d;border:1px solid #bed4ca}.btn.red{background:#fff0ed;color:#b63e2f}.panel{background:white;border:1px solid #e1eae3;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 3px 14px #14473308}.notice{background:#fff6d8;border:1px solid #f5df96;padding:12px 14px;border-radius:12px;font-size:13px;color:#6d5318;margin:16px 0}.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:17px}.tabs button{white-space:nowrap;background:#e6eeea;color:#42645d}.tabs button.active{background:#146b5d;color:white}.calendar{background:white;border:1px solid #e1eae3;border-radius:16px;padding:12px;margin:15px auto;max-width:520px;width:100%;overflow:hidden}.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.calhead strong{font-size:16px;line-height:1.2;text-align:center}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;max-width:100%}.calweekday{text-align:center;font-size:11px;color:#6b7e78;padding:3px 0}.caldate{position:relative;min-height:36px;font-size:13px;background:#f6f9f6;color:#304c46;border:1px solid transparent;border-radius:9px;padding:7px 2px;font-weight:600;max-width:100%}.caldate.has-event{background:#d8f2e5;color:#075943;border:1px solid #80cba7}.caldate.selected{background:#146b5d;color:white;border:2px solid #146b5d}.caldate:disabled{background:transparent;cursor:default}.calnote{margin-top:10px;color:#5b756b;font-size:12px;line-height:1.5}.daynav{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin:17px 0 10px}.daynav label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}.daynav input{width:auto;max-width:160px}.daynav button{white-space:nowrap}.daytitle{font-size:17px;margin:20px 0 10px}.event{display:grid;grid-template-columns:80px 1fr;gap:14px;margin-bottom:10px}.time{font-weight:750;padding-top:14px;font-variant-numeric:tabular-nums}.time small{display:block;font-weight:400;color:#7b8983;font-size:11px}.eventbody{border:1px solid #e1eae3;border-radius:13px;background:white;padding:13px 15px;min-width:0}.eventhead{display:flex;justify-content:space-between;gap:8px;min-width:0}.type{font-size:12px;color:#57766b;font-weight:700}.name{font-weight:750;margin:4px 0}.details{font-size:13px;color:#58716a;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{background:#edf5f1;color:#176b5c;padding:6px 11px;font-size:12px}.empty{text-align:center;color:#657c75;padding:45px 12px}.modalback{position:fixed;inset:0;background:#071b17a9;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}.modalback.show{display:flex}.modal{background:white;border-radius:19px;width:min(650px,100%);max-height:95vh;overflow:auto;padding:22px}.modal h2{margin:0 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;min-width:0}.field.full{grid-column:1/-1}input,select,textarea{width:100%;border:1px solid #ccdad2;border-radius:9px;padding:10px;color:#173b37;font:inherit;background:white;min-width:0}textarea{min-height:65px}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}a{color:#146b5d}footer{font-size:12px;color:#678077;margin-top:26px;line-height:1.6}

.loginbox{max-width:470px;margin:28px auto;padding:23px;background:white;border:1px solid #d8e7df;border-radius:16px}.loginbox h2{margin-top:0}.loginbox .field{margin:12px 0}.status{font-size:13px;padding:12px;border-radius:10px;background:#e9f6ef;margin-bottom:16px;line-height:1.5}.status.error{background:#ffe8e4;color:#8c241d}.account{font-size:12px;color:#e4f4ec;margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:100%}#userEmail{overflow-wrap:anywhere;word-break:break-all;line-height:1.4;max-width:100%}#workspace{display:none}#loginView{display:block}#logoutBtn{background:#fff;color:#146b5d;padding:6px 12px;margin-left:0;flex:0 0 auto}

/* Compact top layout after removing descriptive text */
header{padding-top:16px;padding-bottom:14px}header h1{margin-bottom:0}.wrap{padding-top:12px}.calendar{margin-top:10px;margin-bottom:10px}.calhead{margin-bottom:8px}.daynav{margin-top:10px;margin-bottom:8px}.status{margin-bottom:10px}

/* Calendar weekday/holiday colors. Preserve scheduled day emphasis. */
.calweekday:first-child{color:#c62828;font-weight:700}
.calweekday:nth-child(7){color:#1565c0;font-weight:700}
.caldate.is-sunday,.caldate.is-holiday{color:#c62828}
.caldate.is-saturday:not(.is-holiday){color:#1565c0}
.caldate.selected:not(.is-sunday):not(.is-saturday):not(.is-holiday){color:#fff}
.caldate.selected.is-sunday,.caldate.selected.is-holiday{background:#fff1f1;color:#b71c1c;border:2px solid #146b5d}
.caldate.selected.is-saturday:not(.is-holiday){background:#eef5ff;color:#1558aa;border:2px solid #146b5d}


/* Compact daily itinerary cards */
.event{grid-template-columns:66px minmax(0,1fr);gap:8px;margin-bottom:8px;align-items:start}
.eventbody{padding:9px 11px;border-radius:11px}
.eventhead{display:flex;align-items:center;justify-content:space-between;gap:6px}

.time{font-size:17px;line-height:1.1;padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:750}
.time-start,.time-arrival{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Header backup dropdown */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap}
header h1{min-width:0;flex:1;margin:0;font-size:clamp(16px,4.1vw,25px)}
header .account{display:flex;align-items:center;flex-wrap:nowrap;gap:6px;margin:0;flex:0 0 auto}
#logoutBtn{font-size:12px;padding:8px 9px;white-space:nowrap}
.backup-menu{position:relative;color:#146b5d;font-size:12px;z-index:4}
.backup-menu summary{list-style:none;cursor:pointer;background:#fff;border-radius:9px;padding:8px 9px;font-weight:700;white-space:nowrap}
.backup-menu summary::-webkit-details-marker{display:none}
.backup-menu summary::after{content:' ▾';font-size:10px}
.backup-options{position:absolute;right:0;top:calc(100% + 6px);min-width:142px;background:#fff;border:1px solid #d7e4dd;border-radius:10px;box-shadow:0 8px 24px #102e2440;padding:5px;z-index:5}

/* Prominent selected date, without previous/next event buttons */
.day-summary{font-size:21px;font-weight:800;line-height:1.4;color:#173b37;margin:12px 0 12px;letter-spacing:.01em;}
@media(max-width:640px){.day-summary{font-size:20px;margin:11px 0 10px;}}
/* Compact reservation cards */
.event{gap:9px;margin-bottom:6px;align-items:stretch}
.eventbody{padding:8px 10px;border-radius:10px}
.eventhead{align-items:center;gap:7px;margin-bottom:3px}
.event-ident{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;min-width:0;line-height:1.35}
.service-inline{font-size:12px;font-weight:700;color:#275b4f;overflow-wrap:anywhere}
.eventhead .actions{margin:0;flex:0 0 auto}

.place-title{margin:2px 0 1px;line-height:1.35}

@media(max-width:640px){.event{gap:6px;margin-bottom:6px}.eventbody{padding:7px 9px}.eventhead{gap:4px}.service-inline{font-size:11px}.eventhead .actions button{font-size:11px;padding:4px 7px}}

/* Readable compact itinerary and pink selected calendar day */
.caldate.selected,
.caldate.selected.is-sunday,
.caldate.selected.is-holiday,
.caldate.selected.is-saturday:not(.is-holiday),
.caldate.selected:not(.is-sunday):not(.is-saturday):not(.is-holiday){
  background:#fff0f6;
  color:#9c174c;
  border:3px solid #c2185b;
  box-shadow:0 0 0 1px #f4bbd0 inset;
  font-weight:800;
}
.caldate.selected.is-sunday,.caldate.selected.is-holiday{color:#c62828}
.caldate.selected.is-saturday:not(.is-holiday){color:#1565c0}
.caldate.selected:after{background:#c2185b!important}
.service-inline{font-size:10px!important;font-weight:400!important;color:#879790!important;line-height:1.35}
.event .time{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding-top:10px;font-variant-numeric:tabular-nums;line-height:1.15}
.time-start{font-size:18px;font-weight:800;color:#173b37;letter-spacing:-.3px}
.time-arrow{font-size:12px;font-weight:400;color:#94a69f;line-height:1;margin:1px 0}
.time-arrival{font-size:15px;font-weight:650;color:#59736b;letter-spacing:-.2px}
@media(max-width:640px){
  .event{grid-template-columns:60px minmax(0,1fr);gap:6px}
  .event .time{padding-top:8px}
  .time-start{font-size:17px}
  .time-arrival{font-size:14px}
}

/* 予定日は背景で区別し、日付数字に重なるドットを非表示 */
.caldate.has-event::after,.caldate.selected::after{content:none!important;display:none!important}

/* 時刻を予定カード全体の高さに合わせて上下中央へ */
.event{align-items:stretch}
.event .time{align-self:stretch;justify-content:center;padding-top:0;padding-bottom:0;min-height:100%;text-align:center}
@media(max-width:640px){.event .time{justify-content:center;padding-top:0;padding-bottom:0}}

/* iPhone: modal stays within the visible screen; only fields scroll. */
.modalback{padding:env(safe-area-inset-top, 0px) 8px env(safe-area-inset-bottom, 0px);overscroll-behavior:contain}
.modal{display:flex;flex-direction:column;width:min(650px,100%);height:min(740px,calc(100dvh - 18px));max-height:calc(100dvh - 18px);overflow:hidden;padding:16px 15px 12px;border-radius:16px}
.modal h2{flex:0 0 auto;font-size:19px;margin:0 0 10px}
.modal #form{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.modal .fields{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:3px 2px 12px;align-content:start}
.modal .modalfooter{flex:0 0 auto;margin-top:0;padding-top:10px;border-top:1px solid #e1eae3;background:white;justify-content:flex-end}
.modal .field[hidden]{display:none!important}
@media(max-width:640px){.modal{height:calc(100dvh - 14px);max-height:calc(100dvh - 14px);padding:14px 12px 10px}.modal .fields{gap:10px}.modal .modalfooter{gap:5px}.modal .modalfooter button{font-size:13px;padding:10px 11px}}


/* iPhone: registration fields scroll vertically only, never horizontally. */
.modalback,.modal,.modal #form,.modal .fields{min-width:0;max-width:100%;box-sizing:border-box;overflow-x:hidden}
.modal .fields{display:flex;flex-direction:column;gap:10px;width:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.modal .field,.modal input,.modal select,.modal textarea{min-width:0;max-width:100%;box-sizing:border-box}
.modal .field{width:100%;flex:0 0 auto;overflow:hidden}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;display:block;font-size:16px}
.modal .modalfooter{min-width:0;max-width:100%;overflow-x:hidden}
@media(max-width:640px){.modalback{padding-left:8px;padding-right:8px}.modal{width:100%;max-width:100%}.modal .fields{padding-left:0;padding-right:0}}

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

</head><body>
<header><h1>🌸 横浜花博管理アプリ</h1><div class="account" id="account" style="display:none"><span id="userEmail" hidden></span><details class="backup-menu" id="backupMenu"><summary>バックアップ</summary><div class="backup-options"><button type="button" onclick="exportData();document.getElementById('backupMenu').open=false">↓ 保存する</button><button type="button" onclick="document.getElementById('importFile').click();document.getElementById('backupMenu').open=false">↑ 読み込む</button></div></details><button id="logoutBtn" type="button">ログアウト</button></div></header>
<section id="loginView" class="loginbox"><h2>家族専用ログイン</h2><p class="sub">Firebaseに登録したメールアドレスとパスワードでログインしてください。アカウントの新規作成はアプリからできません。</p><form id="loginForm"><label class="field">メールアドレス<input id="loginEmail" type="email" autocomplete="username" required></label><label class="field">パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="submit" id="loginBtn">ログイン</button></form><p class="sub" id="loginError" role="alert"></p></section>
<div id="workspace">
<main class="wrap"><div class="top"><div><h2 style="margin:0">旅行スケジュール</h2></div><button onclick="openForm()">＋ 予定を登録</button></div>

<section class="calendar" aria-label="月間予定カレンダー"><div class="calhead"><button type="button" class="btn alt" onclick="moveMonth(-1)" aria-label="前の月">‹ 前月</button><strong id="calendarMonth"></strong><button type="button" class="btn alt" onclick="moveMonth(1)" aria-label="次の月">次月 ›</button></div><div id="calendarGrid" class="calgrid"></div></section><div id="daySummary" class="day-summary" aria-live="polite"></div>
<div id="syncStatus" class="status" role="status" aria-live="polite">予約情報を読み込んでいます…</div>
<div id="events"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden onchange="importData(event)"><footer>※登録内容は認証済みの家族メンバー間で共有されます。共用端末では利用後にログアウトしてください。</footer></main>
<div class="modalback" id="overlay" onclick="if(event.target===this)closeForm()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><h2 id="formTitle">予定を登録</h2><form id="form"><input type="hidden" id="id"><div class="fields">
<label class="field">種類<select id="type" onchange="typeChange()"><option value="train">🚃 電車</option><option value="shinkansen">🚄 新幹線</option><option value="bus">🚌 シャトルバス</option><option value="flight">✈️ 飛行機</option><option value="expo">🎟️ 花博・パビリオン予約</option><option value="hotel">🏨 ホテル</option><option value="other">📍 その他</option></select></label>
<label class="field">開始日 *<input id="startDate" type="date" required></label><label class="field">開始時刻<input id="startTime" type="time" step="60"></label>
<label class="field" id="endDateLabel">終了日<input id="endDate" type="date"></label><label class="field">終了時刻<input id="endTime" type="time" step="60"></label>
<label class="field" id="fromLabel">出発地・乗車駅<input id="from" placeholder="例：羽田空港"></label><label class="field" id="toLabel">到着地・降車駅<input id="to" placeholder="例：瀬谷駅"></label>
<label class="field" id="serviceLabel">便名・列車名・予約区分<input id="service" placeholder="例：のぞみ123号"></label>
<label class="field" id="seatLabel">座席・部屋・人数<input id="seat" placeholder="例：3号車 12A・12B"></label>
<label class="field full">メモ<textarea id="memo" placeholder="集合場所、チェックイン方法、持ち物など"></textarea></label>
</div><div class="modalfooter"><button type="button" class="btn red" id="editDeleteBtn" onclick="deleteFromEditor()" style="display:none;margin-right:auto">削除</button><button type="button" class="btn alt" onclick="closeForm()">キャンセル</button><button type="submit">保存する</button></div></form></div></div>
<script>
const KEY='greenexpo-trip-v1';const types={train:['🚃','電車','transport'],shinkansen:['🚄','新幹線','transport'],bus:['🚌','シャトルバス','transport'],flight:['✈️','飛行機','transport'],expo:['🎟️','花博','expo'],hotel:['🏨','宿泊','hotel'],other:['📍','その他','other']};let entries=[];let selectedDay='';let calendarMonth='';let initialScheduleLoaded=false;
let db, auth, unsub=null, loggedIn=false, isMember=false;
const el=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(msg,error=false){const n=el('syncStatus');n.textContent=msg;n.classList.toggle('error',error);n.style.display=(!error && msg.startsWith('同期済み'))?'none':'block'}
async function saveEntry(e){if(!loggedIn||!isMember)throw Error('家族メンバー登録を確認してください');await db.collection('reservations').doc(e.id).set(e)}
function chooseDay(day){if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return;selectedDay=day;calendarMonth=day.slice(0,7);render()}
function moveMonth(amount){const [year,month]=(calendarMonth||selectedDay.slice(0,7)).split('-').map(Number);const d=new Date(year,month-1+amount,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderCalendar()}
function scheduledDays(){const found=new Set();for(const e of entries){if(!/^\d{4}-\d{2}-\d{2}$/.test(e.startDate||''))continue;let d=new Date(e.startDate+'T12:00:00');const limit=/^\d{4}-\d{2}-\d{2}$/.test(e.endDate||'')?new Date(e.endDate+'T12:00:00'):d;for(let i=0;i<366&&d<=limit;i++,d.setDate(d.getDate()+1)){found.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}}return [...found].sort()}

// 2027 Japanese national holidays and statutory holidays (Cabinet Office, including March 22 substitute holiday).
// 2026 included for navigation to the previous year. Other years are not asserted as verified holidays.
const japaneseHolidays = new Set([
'2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
'2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23'
]);
function renderCalendar(){if(!calendarMonth)calendarMonth=selectedDay.slice(0,7);const [year,month]=calendarMonth.split('-').map(Number);el('calendarMonth').textContent=year+'年'+month+'月';const first=new Date(year,month-1,1);const count=new Date(year,month,0).getDate();const scheduled=new Set(scheduledDays());let html=['日','月','火','水','木','金','土'].map(w=>'<span class="calweekday">'+w+'</span>').join('');for(let x=0;x<first.getDay();x++)html+='<span></span>';for(let d=1;d<=count;d++){const day=calendarMonth+'-'+String(d).padStart(2,'0');const has=scheduled.has(day);const weekday=new Date(year,month-1,d).getDay();const isHoliday=japaneseHolidays.has(day);const colorClass=isHoliday?' is-holiday':weekday===0?' is-sunday':weekday===6?' is-saturday':'';html+='<button type="button" class="caldate'+(has?' has-event':'')+colorClass+(day===selectedDay?' selected':'')+'" '+(day===selectedDay?'aria-current="date" ':'')+'aria-label="'+month+'月'+d+'日'+(isHoliday?'、祝日・休日':'')+(has?'、予定あり':'')+'" onclick="chooseDay(\''+day+'\')">'+d+'</button>'}el('calendarGrid').innerHTML=html;}
function relevantDay(e,day){return e.startDate<=day && (!e.endDate || e.endDate>=day)}
function render(){
 if(!selectedDay){selectedDay=scheduledDays()[0]||'2027-03-19'}
 renderCalendar();
 const list=entries.filter(e=>relevantDay(e,selectedDay)).sort((a,b)=>(a.startDate+'T'+(a.startTime||'00:00')).localeCompare(b.startDate+'T'+(b.startTime||'00:00')));
 const root=el('events');
 el('daySummary').textContent=new Date(selectedDay+'T12:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 if(!list.length){root.innerHTML='<div class="empty">この日の予定はありません。「＋ 予定を登録」から追加できます。</div>';return}
 root.innerHTML=list.map(e=>{
   const t=types[e.type]||types.other;
   const start=escapeHtml(e.startTime||'終日');
   const arrival=escapeHtml(e.endTime||'');
   const timeDisplay=e.endTime?`<span class="time-start">${start}</span><span class="time-arrow">↓</span><span class="time-arrival">${arrival}</span>`:`<span class="time-start">${start}</span>`;
   const place=[e.from,e.to].filter(Boolean).map(escapeHtml).join(' → ');
   const extra=[e.seat&&'座席・部屋など：'+e.seat,e.memo].filter(Boolean).map(escapeHtml).join('\n');
   const dateSuffix=e.endDate&&e.endDate!==e.startDate?`<span class="event-end-date">終了日：${escapeHtml(e.endDate)}</span>`:'';
   return `<div class="event"><div class="time">${timeDisplay}</div><div class="eventbody"><div class="eventhead"><div class="event-ident"><span class="type">${t[0]} ${t[1]}</span>${e.service?`<span class="service-inline">${escapeHtml(e.service)}</span>`:''}</div><div class="actions"><button onclick="openForm('${escapeHtml(e.id)}')">編集</button></div></div>${place?`<div class="place-title">${place}</div>`:''}${extra?`<div class="details">${extra}</div>`:''}${dateSuffix}</div></div>`
 }).join('');
}
function typeChange(){
 const t=el('type').value;
 const labels={
  train:['乗車駅','降車駅'],shinkansen:['乗車駅','降車駅'],
  bus:['乗車場所','降車場所'],flight:['出発空港','到着空港'],
  expo:['場所・パビリオン','受付・集合場所'],hotel:['宿泊施設名',''],
  other:['場所・出発地','到着地・詳細']
 };
 const names=labels[t]||labels.other;
 el('fromLabel').firstChild.textContent=names[0];
 el('toLabel').firstChild.textContent=names[1];
 // 非表示の入力値は編集時に消さず、既存の予約情報を保持します。
 el('endDateLabel').hidden=['train','shinkansen'].includes(t);
 el('toLabel').hidden=t==='hotel';
 el('serviceLabel').hidden=['bus','expo','hotel'].includes(t);
 el('seatLabel').hidden=['train','bus','flight','expo'].includes(t);
 el('serviceLabel').firstChild.textContent=t==='train'?'路線名':t==='flight'?'便名':t==='shinkansen'?'列車名・予約区分':'便名・列車名・予約区分';
 el('seatLabel').firstChild.textContent=t==='hotel'?'部屋・人数':t==='shinkansen'?'座席':'座席・部屋・人数';
}
function openForm(id=''){el('form').reset();el('id').value='';el('startDate').value=selectedDay||'2027-03-19';el('endDate').value=el('startDate').value;const e=entries.find(x=>x.id===id);if(e){Object.keys(e).forEach(k=>{if(el(k))el(k).value=e[k]||''})}el('formTitle').textContent=e?'予定を編集':'予定を登録';el('editDeleteBtn').style.display=e?'inline-block':'none';if(!el('endDate').value)el('endDate').value=el('startDate').value;typeChange();el('overlay').classList.add('show')}
el('startDate').addEventListener('change',()=>{el('endDate').value=el('startDate').value});
function closeForm(){el('overlay').classList.remove('show')}
el('form').addEventListener('submit',ev=>{ev.preventDefault();const keys=['id','type','startDate','startTime','endDate','endTime','from','to','service','seat','memo'];const e=Object.fromEntries(keys.map(k=>[k,el(k).value.trim()]));e.title=types[e.type]?.[1]||'その他';if(e.endDate&&e.endDate<e.startDate){alert('終了日は開始日以降にしてください');return}if(e.endDate===e.startDate&&e.startTime&&e.endTime&&e.endTime<e.startTime){alert('終了時刻を確認してください');return}if(!e.id)e.id=(window.crypto?.randomUUID?.()||Date.now()+'-'+Math.random());saveEntry(e).then(()=>{closeForm();chooseDay(e.startDate);setStatus('保存しました。家族の端末にも同期されます。')}).catch(err=>{console.error(err);alert('保存できませんでした。家族メンバー登録と通信状態を確認してください。')})});
async function deleteFromEditor(){const id=el('id').value;if(!id)return;const ok=await removeEntry(id);if(ok)closeForm()}
async function removeEntry(id){if(!isMember){alert('家族メンバー登録が必要です');return false;}if(!confirm('この予定を削除しますか？'))return false;try{await db.collection('reservations').doc(id).delete();setStatus('削除しました。');return true;}catch(err){console.error(err);alert('削除できませんでした。');return false;}}
function exportData(){const blob=new Blob([JSON.stringify({app:'greenexpo-family-trip',version:1,entries},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='花博旅程バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(ev){const file=ev.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='greenexpo-family-trip'||!Array.isArray(data.entries)||data.entries.length>10000||!data.entries.every(e=>e&&typeof e==='object'&&typeof e.title==='string'&&typeof e.startDate==='string'))throw Error('形式が違います');if(confirm('現在の予定をバックアップ内容に置き換えます。よろしいですか？')){const imported=data.entries.map(e=>{const o={};for(const k of ['id','type','title','startDate','startTime','endDate','endTime','from','to','service','booking','person','seat','url','memo'])o[k]=String(e[k]||'').slice(0,3000);return o});await Promise.all(imported.map(e=>saveEntry({...e,id:e.id||crypto.randomUUID()})));setStatus('バックアップの予定をクラウドに追加しました。')}}catch(err){console.error(err);alert('バックアップを読み込めませんでした。形式・権限を確認してください。')}ev.target.value=''}
render();

try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async user=>{if(unsub){unsub();unsub=null;}loggedIn=!!user;isMember=false;el('loginView').style.display=user?'none':'block';el('workspace').style.display=user?'block':'none';el('account').style.display=user?'flex':'none';el('userEmail').textContent=user?.email||'';if(!user){entries=[];selectedDay='';calendarMonth='';initialScheduleLoaded=false;render();return;}setStatus('アクセス権と予約情報を確認しています…');try{const member=await db.collection('familyMembers').doc(user.uid).get();if(!member.exists){setStatus('家族メンバーとして登録されていません。FirebaseのfamilyMembersにUIDを登録してください。',true);return;}isMember=true;unsub=db.collection('reservations').onSnapshot(snap=>{entries=snap.docs.map(d=>({...d.data(),id:d.id}));if(!initialScheduleLoaded){initialScheduleLoaded=true;const dates=scheduledDays();if(dates.length){selectedDay=dates[0];calendarMonth=selectedDay.slice(0,7);}}render();setStatus('同期済み：家族と予定を共有しています。')},err=>{console.error(err);setStatus('同期できません。Firestoreルールをご確認ください。',true)})}catch(err){console.error(err);setStatus('アクセス権を確認できませんでした。',true)}});el('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();el('loginError').textContent='ログイン中…';el('loginBtn').disabled=true;try{await auth.signInWithEmailAndPassword(el('loginEmail').value.trim(),el('loginPassword').value);el('loginPassword').value='';el('loginError').textContent=''}catch(err){console.error(err);el('loginError').textContent='ログインできません。メールアドレス・パスワードをご確認ください。'}finally{el('loginBtn').disabled=false}});el('logoutBtn').addEventListener('click',()=>auth.signOut())}catch(err){console.error(err);el('loginError').textContent='Firebaseを読み込めませんでした。通信状況を確認してください。'}
