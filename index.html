<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花博ファミリー旅程帳</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#173b37;background:#f6f9f6}*{box-sizing:border-box}body{margin:0}header{background:#146b5d;color:white;padding:25px max(18px,calc((100vw - 980px)/2))}header h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#dcf4ea;font-size:13px}.wrap{max-width:980px;margin:auto;padding:20px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.sub{color:#6b7e78;font-size:13px}.btn,button{border:0;border-radius:11px;background:#146b5d;color:white;padding:10px 15px;font-size:14px;font-weight:650;cursor:pointer}.btn.alt{background:white;color:#146b5d;border:1px solid #bed4ca}.btn.red{background:#fff0ed;color:#b63e2f}.panel{background:white;border:1px solid #e1eae3;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 3px 14px #14473308}.notice{background:#fff6d8;border:1px solid #f5df96;padding:12px 14px;border-radius:12px;font-size:13px;color:#6d5318;margin:16px 0}.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:17px}.tabs button{white-space:nowrap;background:#e6eeea;color:#42645d}.tabs button.active{background:#146b5d;color:white}.daytitle{font-size:17px;margin:20px 0 10px}.event{display:grid;grid-template-columns:80px 1fr;gap:14px;margin-bottom:10px}.time{font-weight:750;padding-top:14px;font-variant-numeric:tabular-nums}.time small{display:block;font-weight:400;color:#7b8983;font-size:11px}.eventbody{border:1px solid #e1eae3;border-radius:13px;background:white;padding:13px 15px}.eventhead{display:flex;justify-content:space-between;gap:8px}.type{font-size:12px;color:#57766b;font-weight:700}.name{font-weight:750;margin:4px 0}.details{font-size:13px;color:#58716a;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{background:#edf5f1;color:#176b5c;padding:6px 11px;font-size:12px}.empty{text-align:center;color:#657c75;padding:45px 12px}.modalback{position:fixed;inset:0;background:#071b17a9;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}.modalback.show{display:flex}.modal{background:white;border-radius:19px;width:min(650px,100%);max-height:95vh;overflow:auto;padding:22px}.modal h2{margin:0 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650}.field.full{grid-column:1/-1}input,select,textarea{width:100%;border:1px solid #ccdad2;border-radius:9px;padding:10px;color:#173b37;font:inherit;background:white}textarea{min-height:65px}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}a{color:#146b5d}footer{font-size:12px;color:#678077;margin-top:26px}@media(max-width:520px){.fields{grid-template-columns:1fr}.event{grid-template-columns:59px 1fr;gap:7px}.time{font-size:13px}.wrap{padding:13px 11px 65px}header{padding:22px 16px}.panel{padding:14px}}
</style></head><body>
<header><h1>🌸 花博ファミリー旅程帳</h1><p>GREEN×EXPO 2027｜交通・宿泊・予約をひとつに</p></header>
<main class="wrap"><div class="top"><div><h2 style="margin:0">旅行スケジュール</h2><div class="sub">日時順に予定を表示／1分単位で登録できます</div></div><button onclick="openForm()">＋ 予定を登録</button></div>
<div class="notice"><strong>初期版（試作）</strong>：データはこのブラウザ内に保存されます。まだ家族の端末とは自動同期されません。家族で同時に閲覧・編集するクラウド共有は次の開発段階です。</div>
<div class="tabs"><button class="active" data-filter="all" onclick="setFilter('all')">すべて</button><button data-filter="transport" onclick="setFilter('transport')">🚃 交通</button><button data-filter="expo" onclick="setFilter('expo')">🎟️ 花博</button><button data-filter="hotel" onclick="setFilter('hotel')">🏨 宿泊</button><button data-filter="other" onclick="setFilter('other')">📍 その他</button></div>
<div id="events"></div>
<div class="panel"><strong>データのバックアップ</strong><p class="sub">JSONファイルに保存・復元できます。大切な予約情報は別途保管してください。</p><div class="flex"><button class="btn alt" onclick="exportData()">⬇ バックアップを保存</button><label class="btn alt" style="cursor:pointer">⬆ バックアップを読み込む<input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></label></div></div><footer>※この試作版にはログイン・共有リンク・通知・オンライン同期はありません。予約番号を含むデータを共用端末で保管する場合はご注意ください。</footer></main>
<div class="modalback" id="overlay" onclick="if(event.target===this)closeForm()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><h2 id="formTitle">予定を登録</h2><form id="form"><input type="hidden" id="id"><div class="fields">
<label class="field">種類<select id="type" onchange="typeChange()"><option value="train">🚃 電車・新幹線</option><option value="bus">🚌 バス</option><option value="flight">✈️ 飛行機</option><option value="expo">🎟️ 花博・パビリオン予約</option><option value="hotel">🏨 ホテル</option><option value="other">📍 その他</option></select></label>
<label class="field">予定名 *<input id="title" required maxlength="120" placeholder="例：羽田空港からシャトルバス"></label>
<label class="field">開始日 *<input id="startDate" type="date" required></label><label class="field">開始時刻<input id="startTime" type="time" step="60"></label>
<label class="field">終了日<input id="endDate" type="date"></label><label class="field">終了時刻<input id="endTime" type="time" step="60"></label>
<label class="field" id="fromLabel">出発地・乗車駅<input id="from" placeholder="例：羽田空港"></label><label class="field" id="toLabel">到着地・降車駅<input id="to" placeholder="例：瀬谷駅"></label>
<label class="field">便名・列車名・予約区分<input id="service" placeholder="例：のぞみ123号"></label><label class="field">予約番号<input id="booking" placeholder="予約番号（任意）"></label>
<label class="field">予約者・担当者<input id="person" placeholder="例：父・母・家族全員"></label><label class="field">座席・部屋・人数<input id="seat" placeholder="例：3号車 12A・12B"></label>
<label class="field full">予約確認URL<input id="url" type="url" placeholder="https://..."></label><label class="field full">メモ<textarea id="memo" placeholder="集合場所、チェックイン方法、持ち物など"></textarea></label>
</div><div class="modalfooter"><button type="button" class="btn alt" onclick="closeForm()">キャンセル</button><button type="submit">保存する</button></div></form></div></div>
<script>
const KEY='greenexpo-trip-v1';const types={train:['🚃','電車・新幹線','transport'],bus:['🚌','バス','transport'],flight:['✈️','飛行機','transport'],expo:['🎟️','花博','expo'],hotel:['🏨','宿泊','hotel'],other:['📍','その他','other']};let entries=[];let filter='all';
try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(v)?v:[]}catch{entries=[]}
const el=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}
function setFilter(f){filter=f;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));render()}
function render(){const list=entries.filter(e=>filter==='all'||types[e.type]?.[2]===filter).sort((a,b)=>(a.startDate+'T'+(a.startTime||'00:00')).localeCompare(b.startDate+'T'+(b.startTime||'00:00')));const root=el('events');if(!list.length){root.innerHTML='<div class="empty">予定がありません。「＋ 予定を登録」から追加してください。</div>';return}let prev='';root.innerHTML=list.map(e=>{const t=types[e.type]||types.other;let h='';if(prev!==e.startDate){prev=e.startDate;const d=new Date(e.startDate+'T12:00:00');h+=`<h3 class="daytitle">${escapeHtml(d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}))}</h3>`}const line=[e.from&&e.to?e.from+' → '+e.to:e.from||e.to,e.service,e.seat&&'座席・部屋など：'+e.seat,e.person&&'予約者：'+e.person,e.booking&&'予約番号：'+e.booking,e.memo].filter(Boolean).map(escapeHtml).join('\n');let end=e.endTime?' → '+escapeHtml(e.endTime):'';if(e.endDate&&e.endDate!==e.startDate)end+=' ('+escapeHtml(e.endDate)+')';const safeUrl=/^https?:\/\//i.test(e.url||'')?e.url:'';return h+`<div class="event"><div class="time">${escapeHtml(e.startTime||'終日')}<small>${end}</small></div><div class="eventbody"><div class="eventhead"><span class="type">${t[0]} ${t[1]}</span></div><div class="name">${escapeHtml(e.title)}</div><div class="details">${line}</div><div class="actions">${safeUrl?`<a class="btn alt" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer" style="padding:5px 10px;font-size:12px">予約サイト ↗</a>`:''}<button onclick="openForm('${escapeHtml(e.id)}')">編集</button><button onclick="removeEntry('${escapeHtml(e.id)}')">削除</button></div></div></div>`}).join('')}
function typeChange(){const t=el('type').value;el('fromLabel').firstChild.textContent=t==='hotel'?'宿泊施設名':t==='expo'?'場所・パビリオン': '出発地・乗車駅';el('toLabel').firstChild.textContent=t==='hotel'?'住所・最寄り駅':t==='expo'?'受付・集合場所':'到着地・降車駅'}
function openForm(id=''){el('form').reset();el('id').value='';el('startDate').value='2027-03-19';const e=entries.find(x=>x.id===id);if(e){Object.keys(e).forEach(k=>{if(el(k))el(k).value=e[k]||''})}el('formTitle').textContent=e?'予定を編集':'予定を登録';typeChange();el('overlay').classList.add('show')}
function closeForm(){el('overlay').classList.remove('show')}
el('form').addEventListener('submit',ev=>{ev.preventDefault();const keys=['id','type','title','startDate','startTime','endDate','endTime','from','to','service','booking','person','seat','url','memo'];const e=Object.fromEntries(keys.map(k=>[k,el(k).value.trim()]));if(e.endDate&&e.endDate<e.startDate){alert('終了日は開始日以降にしてください');return}if(e.endDate===e.startDate&&e.startTime&&e.endTime&&e.endTime<e.startTime){alert('終了時刻を確認してください');return}if(!e.id)e.id=(window.crypto?.randomUUID?.()||Date.now()+'-'+Math.random());const i=entries.findIndex(x=>x.id===e.id);if(i>=0)entries[i]=e;else entries.push(e);try{save();closeForm()}catch{alert('保存できませんでした。ブラウザの空き容量をご確認ください。')}});
function removeEntry(id){if(confirm('この予定を削除しますか？')){entries=entries.filter(e=>e.id!==id);save()}}
function exportData(){const blob=new Blob([JSON.stringify({app:'greenexpo-family-trip',version:1,entries},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='花博旅程バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(ev){const file=ev.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='greenexpo-family-trip'||!Array.isArray(data.entries)||data.entries.length>10000||!data.entries.every(e=>e&&typeof e==='object'&&typeof e.title==='string'&&typeof e.startDate==='string'))throw Error('形式が違います');if(confirm('現在の予定をバックアップ内容に置き換えます。よろしいですか？')){entries=data.entries.map(e=>{const o={};for(const k of ['id','type','title','startDate','startTime','endDate','endTime','from','to','service','booking','person','seat','url','memo'])o[k]=String(e[k]||'').slice(0,3000);return o});save()}}catch{alert('バックアップファイルを読み込めませんでした')}ev.target.value=''}
render();
</script></body></html>
